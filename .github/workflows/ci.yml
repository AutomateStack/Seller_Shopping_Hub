name: Seller Shopping Hub CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/product-revision-approval-audit]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Lint application
        run: npm run lint
